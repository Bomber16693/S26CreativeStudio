name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK NDK CMake
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned YuE2 native engine
        run: |
          mkdir -p app/src/main/cpp/yue2
          cd app/src/main/cpp/yue2
          git init -q
          git remote add origin https://github.com/ServeurpersoCom/yue2.cpp.git
          git fetch --depth 1 origin 8af01740686824ffd4a1839a457954f42e2a8ce7
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
      - name: Configure embedded engine
        run: python3 scripts/prepare_native.py
      - name: Build Android ARM64 APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S26Studio-embedded-YuE2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
